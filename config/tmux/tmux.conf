# --- Core behavior ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Prefix: keep C-b, add C-a as a second prefix ---
set -g prefix2 C-a
bind C-a send-prefix -2

# --- Splits / panes (keep current path) ---
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode: vi-style selection, yank to system clipboard ---
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Dracula-matched theme ---
BG="#282a36"
FG="#f8f8f2"
COMMENT="#6272a4"
PURPLE="#bd93f9"
PINK="#ff79c6"
GREEN="#50fa7b"
ORANGE="#ffb86c"

set -g status-position bottom
set -g status-style "bg=${BG},fg=${FG}"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 5

set -g status-left "#[fg=${BG},bg=${PURPLE},bold] #S #[fg=${PURPLE},bg=${BG}]"
set -g status-right "#[fg=${COMMENT},bg=${BG}]#[fg=${BG},bg=${COMMENT}] %H:%M #[fg=${ORANGE},bg=${COMMENT}]#[fg=${BG},bg=${ORANGE},bold] #h "

setw -g window-status-current-format "#[fg=${BG},bg=${PINK}] #I #[fg=${BG},bg=${PINK},bold]#W #[fg=${PINK},bg=${BG}]"
setw -g window-status-format "#[fg=${FG},bg=${BG}] #I #W "
setw -g window-status-activity-style "fg=${GREEN},bg=${BG}"

set -g pane-border-style "fg=${COMMENT}"
set -g pane-active-border-style "fg=${PURPLE}"

set -g message-style "bg=${PURPLE},fg=${BG},bold"
