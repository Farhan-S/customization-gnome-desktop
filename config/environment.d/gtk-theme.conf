# GTK_THEME=Dracula was removed on 2026-08-28.
#
# It was set to force the Dracula theme onto GTK4/libadwaita apps, but it has
# the side effect of making libadwaita ignore colour overrides from
# ~/.config/gtk-4.0/gtk.css - named colours (window_bg_color, headerbar_bg_color,
# card_bg_color, ...) silently resolve to stock Adwaita values instead.
#
# GTK4/libadwaita theming now lives in ~/.config/gtk-4.0/gtk.css.
# GTK3 apps still get Dracula via gsettings (org.gnome.desktop.interface
# gtk-theme), which does not need this variable.
